<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Songsterr Classic</title>
    <link rel="stylesheet" href="popup.css">

<body data-state="loading">
<main>
    <header>
        <h1>Songsterr <strong>Classic</strong></h1>
        <div class="toggle-wrap">
            <button id="toggle" type="button" role="switch" aria-checked="false" aria-label="Classic interface" aria-describedby="reload-note" disabled>
                <span class="thumb"><span class="thumb-mark"></span></span>
            </button>
            <span id="reload-note" role="tooltip">Switching reloads this tab.<br>Save your changes first.</span>
        </div>
    </header>
    <p id="status" class="sr-only" role="status" aria-live="polite">Checking…</p>
    <p id="notice" hidden></p>
    <p id="error" role="alert" hidden></p>
    <footer>
        <span id="version"></span>
        <nav aria-label="Project links">
            <a href="https://github.com/Raghav-B/songsterr-classic" target="_blank" rel="noopener noreferrer" aria-label="GitHub repository" title="GitHub repository">

        </nav>
    </footer>
</main>
<script src="popup.js"></script>
</body>
</html>
